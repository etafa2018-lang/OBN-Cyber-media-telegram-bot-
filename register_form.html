<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Registration | OBN Cyber Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            padding: 20px;
        }
        
        .form-card {
            background: #ffffff;
            border-radius: 35px;
            padding: 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            border: 1px solid rgba(220,38,38,0.2);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
        }
        
        .official-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(220,38,38,0.3);
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: 1px;
        }
        
        .logo-sub {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        h1 {
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 26px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
            letter-spacing: 1px;
        }
        
        .subtitle::before,
        .subtitle::after {
            content: '—';
            margin: 0 10px;
            opacity: 0.5;
            color: #dc2626;
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            z-index: 2;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        input, select {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 14px;
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 500;
        }
        
        input:focus, select:focus {
            border-color: #dc2626;
            outline: none;
            background: white;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button i {
            margin-right: 10px;
        }
        
        .note {
            margin-top: 18px;
            font-size: 11px;
            color: #999;
            text-align: center;
        }
        
        select {
            appearance: none;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }
            .logo-wrapper {
                width: 65px;
                height: 65px;
            }
            .logo-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img class="official-logo" src="https://play-lh.googleusercontent.com/rJlwNcKtqocZlvqjIvZSFZilJt5XAaZntPP8kto-9dI9BWTY0cFtsUEo74x0Xl7Z7MvG=w240-h480-rw" alt="OBN Cyber Media Logo">
            </div>
            <div class="logo-text">OBN CYBER MEDIA</div>
            <div class="logo-sub">STREAMLINING TELEGRAM BOT</div>
        </div>
        
        <h1>Registration</h1>
        <div class="subtitle">Create Your Account</div>
        
        <form id="regForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required placeholder="Enter your full name">
            </div>
            
            <div class="input-group">
                <i class="fas fa-venus-mars"></i>
                <label for="sex">Sex</label>
                <select id="sex" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-globe"></i>
                <label for="muummee">Muummee</label>
                <select id="muummee" required>
                    <option value="">Select Muummee</option>
                    <option value="Cyber media">Cyber media</option>
                    <option value="Sagantaa">Sagantaa</option>
                    <option value="Tibbanaafi Gulaanaa">Tibbanaafi Gulaanaa</option>
                    <option value="Horn of Africa">Horn of Africa</option>
                    <option value="Teekinooloojii">Teekinooloojii</option>
                    <option value="Bulchiinsaafi faayinansii">Bulchiinsaafi faayinansii</option>
                    <option value="Qoannoofi qo'annoo">Qoannoofi qo'annoo</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-briefcase"></i>
                <label for="gahe">Gahe Hojii</label>
                <select id="gahe" required>
                    <option value="">Select Role</option>
                    <option value="Muummee">Muummee</option>
                    <option value="Desk or Director">Desk or Director</option>
                    <option value="Qopheessa">Qopheessa</option>
                    <option value="Gulaalaa qophii">Gulaalaa qophii</option>
                    <option value="Gulaalaa sur-sagalee">Gulaalaa sur-sagalee</option>
                    <option value="Export">Export</option>
                    <option value="Streaming">Streaming</option>
                </select>
            </div>
            
            <div class="input-group" id="gitaGroup" style="display:none;">
                <i class="fas fa-layer-group"></i>
                <label for="gita">Gita</label>
                <select id="gita">
                    <option value="">Select Level</option>
                    <option value="Deskii">Deskii</option>
                    <option value="Ogeessa">Ogeessa</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Register Now
            </button>
        </form>
        
        <div class="note">
            <i class="fas fa-lock"></i> Your information is secure
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const gaheSelect = document.getElementById('gahe');
        const gitaGroup = document.getElementById('gitaGroup');
        const form = document.getElementById('regForm');
        const submitBtn = document.getElementById('submitBtn');

        gaheSelect.addEventListener('change', function() {
            if (this.value === 'Export' || this.value === 'Streaming') {
                gitaGroup.style.display = 'block';
            } else {
                gitaGroup.style.display = 'none';
                document.getElementById('gita').value = '';
            }
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                full_name: document.getElementById('full_name').value.trim(),
                sex: document.getElementById('sex').value,
                muummee: document.getElementById('muummee').value,
                gahe: document.getElementById('gahe').value,
                gita: document.getElementById('gita').value || null
            };

            if (!data.full_name || !data.sex || !data.muummee || !data.gahe) {
                tg.showAlert('Please fill all required fields.');
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner"></i> Registering...';
            tg.sendData(JSON.stringify(data));
            submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Registered!';
            setTimeout(() => {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Register Now';
            }, 2000);
        });
    </script>
</body>
</html>
