<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Registration | OBN Cyber Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Background with Red Accents */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(220,38,38,0.1) 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }
        
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
        
        /* Floating particles */
        .particle {
            position: absolute;
            background: rgba(220,38,38,0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-50px) translateX(30px); opacity: 0.5; }
        }
        
        .form-card {
            background: #ffffff;
            border-radius: 35px;
            padding: 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(220,38,38,0.2);
        }
        
        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
            border-color: rgba(220,38,38,0.4);
        }
        
        /* Logo Section */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        /* Official OBN Logo - Permanently Fixed by Coder */
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            position: relative;
        }
        
        .official-logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(220,38,38,0.3);
            animation: logoGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes logoGlow {
            0% { box-shadow: 0 8px 20px rgba(220,38,38,0.3); }
            100% { box-shadow: 0 8px 30px rgba(220,38,38,0.6); }
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: 1px;
        }
        
        .logo-sub {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        /* Animated Header */
        h1 {
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 26px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            position: relative;
        }
        
        .subtitle::before,
        .subtitle::after {
            content: '—';
            margin: 0 10px;
            opacity: 0.5;
            color: #dc2626;
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateX(-20px);
        }
        
        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }
        .input-group:nth-child(3) { animation-delay: 0.3s; }
        .input-group:nth-child(4) { animation-delay: 0.4s; }
        .input-group:nth-child(5) { animation-delay: 0.5s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        input, select {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 500;
        }
        
        input:focus, select:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
            transform: scale(1.01);
            background: white;
        }
        
        input:hover, select:hover {
            border-color: #dc2626;
        }
        
        /* Animated Button */
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(220,38,38,0.3);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(220,38,38,0.4);
        }
        
        button:active {
            transform: translateY(2px);
        }
        
        button i {
            margin-right: 10px;
            transition: transform 0.3s;
        }
        
        button:hover i {
            transform: translateX(5px);
        }
        
        .note {
            margin-top: 18px;
            font-size: 11px;
            color: #999;
            text-align: center;
        }
        
        select {
            appearance: none;
            cursor: pointer;
        }
        
        /* Loading state */
        button.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        button.loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }
            .logo-wrapper {
                width: 65px;
                height: 65px;
            }
            .logo-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="form-card">
        <!-- OBN Cyber Media Logo Section - Permanently Fixed -->
        <div class="logo-container">
           <div class="logo-wrapper">
    <img class="official-logo" src="https://play-lh.googleusercontent.com/rJlwNcKtqocZlvqjIvZSFZilJt5XAaZntPP8kto-9dI9BWTY0cFtsUEo74x0Xl7Z7MvG=w240-h480-rw" alt="OBN Cyber Media Logo">
</div>
            <div class="logo-text">OBN CYBER MEDIA</div>
            <div class="logo-sub">STREAMLINING TELEGRAM BOT</div>
        </div>
        
        <h1>Registration</h1>
        <div class="subtitle">Create Your Account</div>
        
        <form id="regForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required placeholder="Enter your full name">
            </div>
            
            <div class="input-group">
                <i class="fas fa-venus-mars"></i>
                <label for="sex">Sex</label>
                <select id="sex" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-globe"></i>
                <label for="muummee">Muummee</label>
                <select id="muummee" required>
                    <option value="">Select Muummee</option>
                    <option value="Cyber media">Cyber media</option>
                    <option value="Sagantaa">Sagantaa</option>
                    <option value="Tibbanaafi Gulaanaa">Tibbanaafi Gulaanaa</option>
                    <option value="Horn of Africa">Horn of Africa</option>
                    <option value="Teekinooloojii">Teekinooloojii</option>
                    <option value="Bulchiinsaafi faayinansii">Bulchiinsaafi faayinansii</option>
                    <option value="Qoannoofi qo'annoo">Qoannoofi qo'annoo</option>
                </select>
            </div>
            
            <div class="input-group">
                <i class="fas fa-briefcase"></i>
                <label for="gahe">Gahe Hojii</label>
                <select id="gahe" required>
                    <option value="">Select Role</option>
                    <option value="Muummee">Muummee</option>
                    <!-- Daarikteera removed -->
                    <option value="Qopheessa">Qopheessa</option>
                    <option value="Gulaalaa qophii">Gulaalaa qophii</option>
                    <option value="Gulaalaa sur-sagalee">Gulaalaa sur-sagalee</option>
                    <option value="Export">Export</option>
                    <option value="Streaming">Streaming</option>
                </select>
            </div>
            
            <div class="input-group" id="gitaGroup" style="display:none;">
                <i class="fas fa-layer-group"></i>
                <label for="gita">Gita</label>
                <select id="gita">
                    <option value="">Select Level</option>
                    <option value="Deskii">Deskii</option>
                    <option value="Ogeessa">Ogeessa</option>
                </select>
            </div>
            
            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Register Now
            </button>
        </form>
        
        <div class="note">
            <i class="fas fa-lock"></i> Your information is secure
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const gaheSelect = document.getElementById('gahe');
        const gitaGroup = document.getElementById('gitaGroup');
        const form = document.getElementById('regForm');
        const submitBtn = document.getElementById('submitBtn');

        // Create floating particles
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = Math.random() * 8 + 4 + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();

        // Show/hide Gita field
        gaheSelect.addEventListener('change', function() {
            if (this.value === 'Export' || this.value === 'Streaming') {
                gitaGroup.style.display = 'block';
                gitaGroup.style.animation = 'slideIn 0.5s ease-out forwards';
            } else {
                gitaGroup.style.display = 'none';
                document.getElementById('gita').value = '';
            }
        });

        // Add ripple effect to button
        function createRipple(event) {
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 600);
        }
        
        submitBtn.addEventListener('click', createRipple);

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const data = {
                full_name: document.getElementById('full_name').value.trim(),
                sex: document.getElementById('sex').value,
                muummee: document.getElementById('muummee').value,
                gahe: document.getElementById('gahe').value,
                gita: document.getElementById('gita').value || null
            };

            if (!data.full_name || !data.sex || !data.muummee || !data.gahe) {
                tg.showAlert('Please fill all required fields.');
                const emptyFields = document.querySelectorAll('input:invalid, select:invalid');
                emptyFields.forEach(field => {
                    field.style.animation = 'shake 0.3s ease-in-out';
                    setTimeout(() => field.style.animation = '', 300);
                });
                return;
            }

            // Add loading state
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner"></i> Registering...';
            
            setTimeout(() => {
                tg.sendData(JSON.stringify(data));
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Registered!';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
                
                setTimeout(() => {
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Register Now';
                    submitBtn.style.background = '';
                }, 2000);
            }, 500);
        });
    </script>
</body>
</html>
