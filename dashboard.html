<!doctype html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBN Cyber Media Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1b2026;--text:#f4f6f8;--muted:#9aa4af;--red:#e21d2b;--line:#2a3038;--ok:#26c281;--warn:#f0ad35;--danger:#ef5b67}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:#0e1115;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:900;font-size:20px;padding:8px 10px 22px}.brand span{color:var(--red)}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#cbd2d9;border:0;text-align:left;padding:12px 13px;border-radius:10px}.nav button:hover,.nav button.active{background:var(--panel2);color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}
.main{flex:1;padding:22px;max-width:1500px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.title h1{margin:0 0 4px;font-size:27px}.title p{margin:0;color:var(--muted)}.pill{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:999px;color:#cbd2d9}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat{font-size:29px;font-weight:800;margin:8px 0}.label{color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.section h2{font-size:17px;margin:0 0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{background:#0e1115;color:#fff;border:1px solid var(--line);padding:10px 11px;border-radius:9px;min-width:170px}.btn{border:1px solid var(--line);background:var(--panel2);color:#fff;padding:10px 13px;border-radius:9px}.btn.primary{background:var(--red);border-color:var(--red)}.btn.small{padding:7px 9px;font-size:12px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{color:#aeb8c3;font-weight:600}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#252b33}.badge.ok{background:rgba(38,194,129,.13);color:#5de1ac}.badge.warn{background:rgba(240,173,53,.14);color:#ffd07b}.badge.bad{background:rgba(239,91,103,.14);color:#ff9aa3}.bar{height:9px;background:#252b33;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:99px}.empty{color:var(--muted);padding:20px;text-align:center}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:15px;width:min(650px,100%);padding:20px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{background:none;border:0;color:#aaa;font-size:25px}.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.perm{border:1px solid var(--line);border-radius:9px;padding:9px}.perm label{display:flex;gap:8px;align-items:center;font-size:12px}.notice{padding:11px;border-radius:10px;background:#201d15;color:#ffd27d;margin-bottom:12px;font-size:13px}.login{max-width:600px;margin:70px auto;background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:16px}.login code{color:#ffb4b9}.chartrow{display:grid;grid-template-columns:130px 1fr 50px;gap:10px;align-items:center;margin:11px 0}.muted{color:var(--muted)}@media(max-width:1000px){.side{width:72px}.brand{font-size:0}.brand span{font-size:20px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:620px){.side{display:none}.main{padding:14px}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.title h1{font-size:22px}.permgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Edit</h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const state={data:null,section:"overview",query:"",status:"all"};
const qs=new URLSearchParams(location.search);
const API_BASE=(localStorage.getItem("obn_api_base")||qs.get("api")||"").replace(/\/$/,"");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(v){return v==null||v===""?"—":esc(v)}
function authHeaders(){return tg?.initData?{"Content-Type":"application/json","X-Telegram-Init-Data":tg.initData}:{"Content-Type":"application/json"}}
async function api(path,opts={}){if(!API_BASE)throw new Error("API base hin qophaa'in. Settings keessaa API URL galchi.");const r=await fetch(API_BASE+path,{...opts,headers:{...authHeaders(),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"API error");return j}
async function load(){try{state.data=await api("/api/dashboard");render()}catch(e){document.getElementById("root").innerHTML=`<div class="login"><h1>OBN Cyber Media</h1><div class="notice">${esc(e.message)}</div><p class="muted">API URL backend Flask kee galchi. Fakkeenya: <code>https://SERVER-KEE</code></p><input id="apiInput" value="${esc(API_BASE)}" placeholder="https://your-server.example" style="width:100%;padding:12px;background:#0e1115;color:white;border:1px solid #333;border-radius:9px"><br><br><button class="btn primary" onclick="saveApi()">Save & Reload</button></div>`}}
async function userAction(uid,action){
  const labels={approve:"approve",reject:"reject",delete:"delete",add_admin:"add admin",remove_admin:"remove admin"};
  if(!confirm(`User ${uid}: ${labels[action]}?`))return;
  try{await api("/api/dashboard/user-action",{method:"POST",body:JSON.stringify({target_user_id:uid,action})});await load();alert("Done.");}
  catch(e){alert(e.message)}
}
async function exportExcel(){
  const start=document.getElementById("exportStart")?.value,end=document.getElementById("exportEnd")?.value;
  if(!start||!end){alert("Start fi end date galchi.");return}
  try{
    const r=await fetch(API_BASE+"/api/dashboard/export",{method:"POST",headers:authHeaders(),
      body:JSON.stringify({start_date:start,end_date:end,datasets:["users","guca_sagantaa_form","live_requests","thumbnail_uploads"]})});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Export failed")}
    const blob=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="OBN_Dashboard_Report.xlsx";a.click();URL.revokeObjectURL(a.href)
  }catch(e){alert(e.message)}
}
function saveApi(){localStorage.setItem("obn_api_base",document.getElementById("apiInput").value.trim());location.reload()}
function nav(){return `<aside class="side"><div class="brand">OBN <span>CYBER</span></div><div class="nav">
<button class="${state.section==="overview"?"active":""}" onclick="go('overview')">📊 Overview</button>
<button class="${state.section==="users"?"active":""}" onclick="go('users')">👥 Users</button>
<button class="${state.section==="guca"?"active":""}" onclick="go('guca')">📋 Guca</button>
<button class="${state.section==="live"?"active":""}" onclick="go('live')">🔴 Live Event</button>
<button class="${state.section==="thumb"?"active":""}" onclick="go('thumb')">🖼️ Thumbnail</button>
<button class="${state.section==="roles"?"active":""}" onclick="go('roles')">🎭 Roles</button>
<button class="${state.section==="perms"?"active":""}" onclick="go('perms')">🔐 Permissions</button>
<button class="${state.section==="audit"?"active":""}" onclick="go('audit')">🧾 Audit Log</button>
</div></aside>`}
function go(s){state.section=s;render();if(s==="perms")setTimeout(permList,50)}
function render(){if(!state.data)return;document.getElementById("root").innerHTML=nav()+`<main class="main"><div class="top"><div class="title"><h1>${title()}</h1><p>OBN CYBER MEDIA • Admin Dashboard</p></div><div><span class="pill">${fmt(state.data.actor?.full_name||"Admin")}</span> <button class="btn small" onclick="load()">↻</button></div></div>${view()}</main>`}
function title(){return ({overview:"Dashboard Overview",users:"Users Management",guca:"Guca Sagantaa",live:"Live Events",thumb:"Thumbnail Workflow",roles:"Role Assignments",perms:"Permission Manager",audit:"Audit Log"})[state.section]}
function stat(label,n){return `<div class="card"><div class="label">${label}</div><div class="stat">${n??0}</div></div>`}
function view(){switch(state.section){case"users":return users();case"guca":return tableView("guca");case"live":return tableView("live");case"thumb":return tableView("thumb");case"roles":return roles();case"perms":return perms();case"audit":return tableView("audit");default:return overview()}}
function overview(){let s=state.data.stats||{};let stages=state.data.guca_stages||{};let max=Math.max(1,...Object.values(stages));return `<div class="cards">${stat("Total Users",s.users)}${stat("Approved",s.approved)}${stat("Pending",s.pending)}${stat("Admins",s.admins)}${stat("Guca Records",s.guca)}${stat("Live Events",s.live)}${stat("Thumbnails",s.thumbnails)}${stat("Audit Entries",s.audit)}</div><div class="grid2"><div class="section"><h2>Guca Workflow Stages</h2>${Object.entries(stages).map(([k,v])=>`<div class="chartrow"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div><b>${v}</b></div>`).join("")||'<div class="empty">No data</div>'}</div><div class="section"><h2>Thumbnail Status</h2>${Object.entries(state.data.thumb_status||{}).map(([k,v])=>`<div class="chartrow"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.min(100,v*8)}%"></i></div><b>${v}</b></div>`).join("")||'<div class="empty">No data</div>'}</div></div><div class="section"><h2>Excel Report</h2>
<div class="toolbar"><input type="date" id="exportStart"><input type="date" id="exportEnd">
<button class="btn primary" onclick="exportExcel()">📥 Export Excel</button></div>
<p class="muted">Excel report export permission qabaachuu qabda.</p></div>
<div class="section"><h2>Recent Activity</h2>${auditTable((state.data.audit||[]).slice(0,8))}</div>`}
function tools(placeholder="Search..."){return `<div class="toolbar"><input id="q" placeholder="${placeholder}" value="${esc(state.query)}" oninput="state.query=this.value;filterTable()"><select id="status" onchange="state.status=this.value;filterTable()"><option value="all">All</option><option value="0">Pending</option><option value="1">Approved</option><option value="2">Rejected</option></select><button class="btn" onclick="load()">Refresh</button></div>`}
function users(){let rows=state.data.users||[];return `<div class="section">${tools("Name, username, user ID...")}<div class="tablewrap"><table class="table" id="dataTable"><thead><tr><th>User</th><th>Department</th><th>Role</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.map(u=>`<tr data-search="${esc((u.full_name+" "+u.username+" "+u.user_id+" "+u.muummee+" "+u.gahe).toLowerCase())}" data-status="${u.approved}"><td><b>${fmt(u.full_name)}</b><br><span class="muted">@${fmt(u.username)} · ${u.user_id}</span></td><td>${fmt(u.muummee)}</td><td>${fmt(u.gahe)}<br>${fmt(u.gita)}</td><td>${badge(u.approved)}</td><td>${fmt(u.created_at)}</td><td><button class="btn small" onclick="editPerm(${u.user_id})">Permissions</button></td></tr>`).join("")}</tbody></table></div></div>`}
function badge(v){return v==1?'<span class="badge ok">Approved</span>':v==2?'<span class="badge bad">Rejected</span>':'<span class="badge warn">Pending</span>'}
function tableView(kind){let arr=state.data[kind]||[];let headers={guca:["CutID","Title","Producer","Stage","Created"],live:["ID","Title","Director","Stage","Created"],thumb:["ID","CutID","Program","Designer","Status","Created"],audit:["Time","Actor","Action","Target","Details"]}[kind];return `<div class="section">${tools("Search...")}<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${arr.filter(x=>JSON.stringify(x).toLowerCase().includes(state.query.toLowerCase())).map(x=>kind==="guca"?`<tr><td>${fmt(x.cutid)}</td><td>${fmt(x.title)}</td><td>${fmt(x.producer_name)}</td><td>${fmt(x.stage)}</td><td>${fmt(x.created_at)}</td></tr>`:kind==="live"?`<tr><td>${fmt(x.id)}</td><td>${fmt(x.title)}</td><td>${fmt(x.director_name)}</td><td>${fmt(x.stage)}</td><td>${fmt(x.created_at)}</td></tr>`:kind==="thumb"?`<tr><td>${fmt(x.id)}</td><td>${fmt(x.cutid)}</td><td>${fmt(x.program_title)}</td><td>${fmt(x.graphics_designer_name)}</td><td>${fmt(x.status)}</td><td>${fmt(x.created_at)}</td></tr>`:`<tr><td>${fmt(x.created_at)}</td><td>${fmt(x.actor_name)}<br>${fmt(x.actor_id)}</td><td>${fmt(x.action)}</td><td>${fmt(x.target_type)}:${fmt(x.target_id)}</td><td>${fmt(x.details)}</td></tr>`).join("")||`<tr><td colspan="${headers.length}" class="empty">No records</td></tr>`}</tbody></table></div></div>`}
function auditTable(arr){return `<div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${fmt(x.actor_name)}</td><td>${fmt(x.action)}</td><td>${fmt(x.target_type)}:${fmt(x.target_id)}</td><td>${fmt(x.details)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No activity</td></tr>'}</tbody></table></div>`}
function roles(){let arr=state.data.roles||[];return `<div class="section"><h2>Current Role Assignments</h2><div class="tablewrap"><table class="table"><thead><tr><th>Role</th><th>User</th><th>Assigned By</th><th>Updated</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${fmt(x.role_name)}</b></td><td>${fmt(x.full_name)}<br>${fmt(x.user_id)}</td><td>${fmt(x.assigned_by)}</td><td>${fmt(x.updated_at)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No roles assigned</td></tr>'}</tbody></table></div></div>`}
function perms(){return `<div class="section"><h2>Permission Manager</h2><p class="muted">Root admin qofa. User tokko filadhu; achiis permission isaa grant/revoke godhi.</p><div class="toolbar"><input id="permSearch" placeholder="User ID ykn maqaa..." oninput="permList()"></div><div id="permList"></div></div>`}
function permList(){let q=(document.getElementById("permSearch")?.value||"").toLowerCase();let arr=(state.data.users||[]).filter(u=>(u.full_name+" "+u.username+" "+u.user_id).toLowerCase().includes(q));document.getElementById("permList").innerHTML=arr.map(u=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0"><div><b>${fmt(u.full_name)}</b><div class="muted">@${fmt(u.username)} · ${u.user_id}</div></div><button class="btn small" onclick="editPerm(${u.user_id})">Manage</button></div>`).join("")||'<div class="empty">User hin argamne</div>'}
async function editPerm(uid){let u=(state.data.users||[]).find(x=>x.user_id==uid);if(!u)return;let p=state.data.permissions?.[uid]||{};let fields=state.data.permission_fields||[];document.getElementById("modalTitle").textContent="Permissions — "+(u.full_name||uid);document.getElementById("modalBody").innerHTML=`<p class="muted">User ID: ${uid}</p><div class="perm"><label><input type="checkbox" id="super" ${p.is_super_admin?"checked":""}> 👑 Full Super Admin</label></div><br><div class="permgrid">${fields.map(f=>`<div class="perm"><label><input class="pc" data-field="${esc(f.id)}" type="checkbox" ${p[f.id]?"checked":""}> ${esc(f.label)}</label></div>`).join("")}</div><br><div class="toolbar"><button class="btn primary" onclick="savePerm(${uid},'grant')">Grant Checked</button><button class="btn" onclick="savePerm(${uid},'revoke')">Revoke Checked</button></div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
async function savePerm(uid,action){let selected=[...document.querySelectorAll(".pc:checked")].map(x=>x.dataset.field);try{await api("/api/dashboard/permissions",{method:"POST",body:JSON.stringify({target_user_id:uid,permission_action:action,permissions:selected,is_super_admin:document.getElementById("super").checked})});closeModal();await load();alert("Permission updated.")}catch(e){alert(e.message)}}
function filterTable(){let q=(state.query||"").toLowerCase();document.querySelectorAll("#dataTable tbody tr").forEach(tr=>{let ok=tr.dataset.search?.includes(q);let st=state.status==="all"||tr.dataset.status===state.status;tr.style.display=ok&&st?"":"none"})}
load();
if(state.section==="perms")setTimeout(permList,100);
</script>
</body>
</html>
