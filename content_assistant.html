<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OBN Content Assistant</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #141414;
    --hint: #6b6b6b;
    --brand-red: #d0021b;
    --button: #d0021b;
    --button-text: #ffffff;
    --secondary-bg: #f4f4f4;
    --black: #111111;
    --border: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px 32px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; color: var(--black); }
  .subtitle {
    color: var(--hint);
    font-size: 13px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--brand-red);
  }
  label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--black); }
  input[type=text], textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--brand-red);
  }
  textarea { min-height: 140px; line-height: 1.4; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 12px 16px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--button); color: var(--button-text); }
  .btn-secondary { background: var(--black); color: #ffffff; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-small {
    width: auto;
    padding: 6px 12px;
    font-size: 13px;
    margin-top: 0;
  }
  .card {
    background: var(--secondary-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brand-red);
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
  }
  .card-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--brand-red); margin-bottom: 6px; }
  .card-value { font-size: 14px; white-space: pre-wrap; word-break: break-word; color: var(--black); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .error-box {
    background: rgba(208,2,27,0.08);
    color: var(--brand-red);
    border: 1px solid rgba(208,2,27,0.25);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 12px;
  }
  .info-box {
    background: var(--secondary-bg);
    color: var(--black);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-top: 12px;
  }
  .spelling-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .spelling-item:last-child { border-bottom: none; }
  .wrong { color: var(--brand-red); text-decoration: line-through; }
  .suggestion { color: var(--black); font-weight: 700; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer-note { color: var(--hint); font-size: 12px; text-align: center; margin-top: 22px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <h1>✍️ OBN Content Assistant</h1>
  <div class="subtitle">Content Afaan Oromoo qofaa qopheessuun danda'a.</div>

  <div id="mainForm">
    <label for="programName">Maqaa Sagantaa (OPTIONAL)</label>
    <input type="text" id="programName" placeholder="fakkeenyaaf: Cyber Tour">

    <label for="descInput">Ibsa Video / Sagantaa</label>
    <textarea id="descInput" placeholder="Fakkeenyaaf: Kutaa Sagantaa Cyber Tour har'aatiin, teeknooloojii haaraa fi ammayyaa OBN Cyber Media hojiirra oolche OBN Content Assistant daawwanna."></textarea>

    <button class="btn btn-secondary" id="spellBtn" onclick="checkSpelling()">
      <span id="spellBtnLabel">Check Afaan Oromoo Spelling</span>
    </button>

    <div id="spellingCard" class="card hidden">
      <div class="card-label">SPELLING AFAAN OROMOO</div>
      <div id="spellingList"></div>
      <div id="spellingClean" class="info-box hidden">Dogoggorri spelling hin argamne. 👍</div>
    </div>

    <button class="btn btn-primary" id="generateBtn" onclick="generateContent()">
      <span id="generateBtnLabel">Generate Content</span>
    </button>

    <div id="formError" class="error-box hidden"></div>
  </div>

  <div id="resultArea"></div>

  <div class="footer-note">Ani AI'dha naan dogoggora; sirriitti ilaali, sirreessi ykn fooyyessi.</div>

<script>
  // ---------------------------------------------------------------------
  // HTTPS address that reaches the Flask API running inside obn_bot.py.
  // The Flask server exposes:
  //     POST /api/content-assistant/generate
  //     POST /api/content-assistant/spellcheck
  // (see obn_bot.py — the routes registered on `flask_app`).
  // Telegram WebApps refuse to fetch plain http:// endpoints, so this MUST
  // be https:// (your ngrok tunnel does that).
  // ---------------------------------------------------------------------
const API_BASE_URL = "https://peevish-incontestable-carmon.ngrok-free.dev.ngrok-free.app";

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  let spellingErrors = [];

  function initData() {
    return tg ? tg.initData : "";
  }

  function setBusy(btn, labelEl, busy, busyText, idleText) {
    btn.disabled = busy;
    labelEl.textContent = busy ? busyText : idleText;
  }

  function showError(elId, message) {
    const el = document.getElementById(elId);
    el.textContent = message;
    el.classList.remove("hidden");
  }

  function hideError(elId) {
    document.getElementById(elId).classList.add("hidden");
  }

  // Generic POST helper. Every API call must include:
  //   - Content-Type: application/json
  //   - ngrok-skip-browser-warning: 1   (so ngrok's interstitial is bypassed)
  async function callApi(path, payload) {
    const res = await fetch(`${API_BASE_URL}${path}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "ngrok-skip-browser-warning": "1",
      },
      body: JSON.stringify(payload),
    });

    let data;
    try {
      data = await res.json();
    } catch (e) {
      throw new Error("Deebii server irraa hubachuu hin dandeenye.");
    }
    if (!res.ok) {
      throw new Error(data.error || `Dogoggora server (${res.status})`);
    }
    return data;
  }

  function renderSpelling() {
    const card = document.getElementById("spellingCard");
    const list = document.getElementById("spellingList");
    const clean = document.getElementById("spellingClean");
    card.classList.remove("hidden");
    list.innerHTML = "";

    if (!spellingErrors.length) {
      clean.classList.remove("hidden");
      return;
    }
    clean.classList.add("hidden");

    spellingErrors.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "spelling-item";
      row.innerHTML = `
        <span><span class="wrong">${escapeHtml(item.wrong)}</span> → <span class="suggestion">${escapeHtml(item.suggestion)}</span></span>
        <button class="btn btn-small btn-secondary" onclick="applyFix(${idx})">Fudhadhu</button>
      `;
      list.appendChild(row);
    });
  }

  function applyFix(idx) {
    const item = spellingErrors[idx];
    if (!item) return;
    const textarea = document.getElementById("descInput");
    const current = textarea.value;
    if (current.includes(item.wrong)) {
      textarea.value = current.replace(item.wrong, item.suggestion);
    }
    spellingErrors.splice(idx, 1);
    renderSpelling();
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  async function checkSpelling() {
    hideError("formError");
    const text = document.getElementById("descInput").value.trim();
    if (!text) {
      showError("formError", "Mee dura ibsa video ykn sagantaa galchi.");
      return;
    }
    const btn = document.getElementById("spellBtn");
    const label = document.getElementById("spellBtnLabel");
    setBusy(btn, label, true, "Qorachaa...", "Check Afaan Oromoo Spelling");
    try {
      // Bot endpoint: POST /api/content-assistant/spellcheck
      // Payload keys expected by the server: { initData, text }
      const data = await callApi("/api/content-assistant/spellcheck", {
        initData: initData(),
        text: text,
      });
      spellingErrors = data.errors || [];
      renderSpelling();
    } catch (e) {
      showError("formError", e.message);
    } finally {
      setBusy(btn, label, false, "Qorachaa...", "Check Afaan Oromoo Spelling");
    }
  }

  function copyText(text, btnEl) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btnEl.textContent;
      btnEl.textContent = "Copied ✓";
      setTimeout(() => { btnEl.textContent = original; }, 1200);
    });
  }

  function renderResult(result) {
    const area = document.getElementById("resultArea");
    const fields = [
      ["TITLE", result.title],
      ["DESCRIPTION", result.description],
      ["CATCHY WORD", result.catchy_word],
      ["TAGS", result.tags],
    ];
    area.innerHTML = "";
    fields.forEach(([label, value]) => {
      const card = document.createElement("div");
      card.className = "card";
      const safeValue = escapeHtml(value || "");
      card.innerHTML = `
        <div class="row">
          <div class="card-label">${label}</div>
          <button class="btn btn-small btn-secondary" data-copy>Copy</button>
        </div>
        <div class="card-value">${safeValue}</div>
      `;
      card.querySelector("[data-copy]").addEventListener("click", (e) => copyText(value || "", e.target));
      area.appendChild(card);
    });
    area.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function generateContent() {
    hideError("formError");
    const programName = document.getElementById("programName").value.trim();
    const description = document.getElementById("descInput").value.trim();
    if (!description) {
      showError("formError", "Mee ibsa video ykn sagantaa galchi.");
      return;
    }
    const btn = document.getElementById("generateBtn");
    const label = document.getElementById("generateBtnLabel");
    setBusy(btn, label, true, "Content qopheessaa...", "Generate Content");
    try {
      // Bot endpoint: POST /api/content-assistant/generate
      // Payload keys expected by the server: { initData, program_name, description }
      // Response: { title, description, catchy_word, tags } — no `.result` wrapper.
      const data = await callApi("/api/content-assistant/generate", {
        initData: initData(),
        program_name: programName,
        description: description,
      });
      renderResult(data);
    } catch (e) {
      showError("formError", e.message);
    } finally {
      setBusy(btn, label, false, "Content qopheessaa...", "Generate Content");
    }
  }

</script>
</body>
</html>
