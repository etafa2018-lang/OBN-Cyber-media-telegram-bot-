<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Stream Request | OBN Cyber Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(220,38,38,0.1) 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out alternate infinite;
            z-index: 0;
        }
        
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
        
        .particle {
            position: absolute;
            background: rgba(220,38,38,0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-50px) translateX(30px); opacity: 0.5; }
        }
        
        .form-card {
            background: #ffffff;
            border-radius: 35px;
            padding: 35px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(220,38,38,0.2);
        }
        
        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
            border-color: rgba(220,38,38,0.4);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(220,38,38,0.15);
            position: relative;
        }
        
        .logo-wrapper {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .official-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(220,38,38,0.2);
            transition: transform 0.3s ease;
        }
        
        .official-logo:hover {
            transform: scale(1.05);
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: 1.5px;
            margin-top: 5px;
        }
        
        .logo-sub {
            font-size: 9px;
            color: #888;
            margin-top: 3px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .logo-container::before {
            content: '●●●';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: rgba(220,38,38,0.3);
            letter-spacing: 4px;
        }
        
        h1 {
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .live-dot {
            font-size: 12px;
            color: #dc2626;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            position: relative;
        }
        
        .subtitle::before,
        .subtitle::after {
            content: '—';
            margin: 0 10px;
            opacity: 0.5;
            color: #dc2626;
        }
        
        .input-group {
            margin-bottom: 22px;
            position: relative;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateX(-20px);
        }
        
        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }
        .input-group:nth-child(3) { animation-delay: 0.3s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        #ethiopianInlineGroup input[type="text"],
        #ethiopianInlineGroup input[type="time"],
        #ethiopianInlineGroup select {
            padding: 14px 16px 14px 48px;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
            font-size: 14px;
            color: #111827;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(15,23,42,0.06);
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            appearance: none;
        }
        
        #ethiopianInlineGroup input[type="text"]::placeholder {
            color: #9ca3af;
            font-weight: 500;
        }
        
        #ethiopianInlineGroup input[type="text"]:focus,
        #ethiopianInlineGroup input[type="time"]:focus,
        #ethiopianInlineGroup select:focus {
            outline: none;
            transform: translateY(-2px);
            border-color: #dc2626;
            box-shadow: 0 8px 26px rgba(220,38,38,0.08);
        }
        
        #ethiopianInlineGroup > div { display:flex; gap:12px; }
        @media (min-width: 720px) {
            #ethiopianInlineGroup input[type="text"] { flex: 1 1 60%; }
            #ethiopianInlineGroup input[type="time"] { flex: 0 0 160px; }
            #ethiopianInlineGroup select { flex: 1 1 40%; }
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 500;
        }
        
        textarea {
            padding-top: 14px;
            resize: vertical;
            min-height: 100px;
        }
        
        input:focus, textarea:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
            transform: scale(1.01);
            background: white;
        }
        
        input:hover, textarea:hover {
            border-color: #dc2626;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(220,38,38,0.3);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(220,38,38,0.4);
        }
        
        button:active {
            transform: translateY(2px);
        }
        
        button i {
            margin-right: 10px;
            transition: transform 0.3s;
        }
        
        button:hover i {
            transform: translateX(5px);
        }
        
        .note {
            margin-top: 18px;
            font-size: 11px;
            color: #999;
            text-align: center;
        }
        
        .live-badge {
            display: inline-block;
            background: #dc2626;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            animation: pulse 1.5s infinite;
            letter-spacing: 0.5px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
        
        button.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        button.loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }
            .logo-wrapper {
                width: 70px;
                height: 70px;
            }
            .official-logo {
                width: 62px;
                height: 62px;
            }
            .logo-text {
                font-size: 18px;
            }
            h1 {
                font-size: 20px;
            }
            .live-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            #ethiopianInlineGroup > div { flex-direction: column; gap: 10px; }
            #ethiopianInlineGroup input[type="text"],
            #ethiopianInlineGroup input[type="time"],
            #ethiopianInlineGroup select {
                width: 100%;
                padding-left: 42px;
                font-size: 14px;
            }
            input, textarea {
                padding: 12px 12px 12px 44px;
                font-size: 14px;
            }
            button { padding: 14px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img class="official-logo" src="https://play-lh.googleusercontent.com/rJlwNcKtqocZlvqjIvZSFZilJt5XAaZntPP8kto-9dI9BWTY0cFtsUEo74x0Xl7Z7MvG=w240-h480-rw" alt="OBN Cyber Media Logo">
            </div>
            <div class="logo-text">OBN CYBER MEDIA</div>
            <div class="logo-sub">STREAMLINING TELEGRAM BOT</div>
        </div>
        
        <h1>
            <i class="fas fa-circle live-dot"></i>
            Live Stream Request
            <span class="live-badge">LIVE</span>
        </h1>
        <div class="subtitle">Request a live broadcasting event</div>
        
        <form id="liveForm">
            <div class="input-group">
                <i class="fas fa-heading"></i>
                <label for="title">Program Title</label>
                <input type="text" id="title" required placeholder="e.g. Text your program title here">
            </div>
            
            <div class="input-group">
                <i class="fas fa-align-left"></i>
                <label for="description">Description</label>
                <textarea id="description" required placeholder="Brief description of your live stream..."></textarea>
            </div>
            
            <div class="input-group">
                <i class="fas fa-calendar-alt"></i>
                <label>Scheduled Date & Time (Ethiopian Calendar)</label>
                <div id="ethiopianInlineGroup">
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div style="flex:1; position:relative;">
                            <i class="fas fa-calendar-day" style="position:absolute; left:15px; top:50%; transform:translateY(-50%); z-index:2;"></i>
                            <input type="text" id="ethDate" placeholder="DD/MM/YYYY" style="padding-left:42px; width:100%;" />
                        </div>
                        <div style="flex:1; position:relative; display:flex; gap:8px; align-items:center;">
                            <i class="fas fa-clock" style="position:absolute; left:15px; top:50%; transform:translateY(-50%); z-index:2;"></i>
                            <input type="time" id="ethTime" style="width:140px; padding-left:42px;" />
                            <select id="ethPeriod" style="flex:1;">
                                <option value="Ganama">Ganama</option>
                                <option value="Guyyaa">Guyyaa</option>
                                <option value="Galgala">Galgala</option>
                            </select>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="scheduled_date" name="scheduled_date">
            </div>
            
            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Request Live Stream
            </button>
        </form>
        
        <div class="note">
            <i class="fas fa-clock"></i> Only future dates & times are allowed. Please verify your schedule.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const form = document.getElementById('liveForm');
        const submitBtn = document.getElementById('submitBtn');
        
        // ======================== ETHIOPIAN ↔ GREGORIAN CONVERSION (ACCURATE) ========================
        // Ethiopian months: 1=Meskerem ... 13=Pagume
        function isEthiopianLeapYear(ethYear) {
            // Ethiopian leap year cycle: every 4 years starting from year 1 (which is AD 8)
            // In Ethiopian calendar, year 1 was AD 8, so leap year if (ethYear % 4 == 0)
            return (ethYear % 4 === 0);
        }
        
        // Convert Ethiopian date to Gregorian Date object (UTC based to avoid timezone shifts)
        function ethiopianToGregorian(day, month, year) {
            // Validate ranges
            if (month < 1 || month > 13) throw new Error("Invalid Ethiopian month");
            let maxDays = (month === 13) ? (isEthiopianLeapYear(year) ? 6 : 5) : 30;
            if (day < 1 || day > maxDays) throw new Error("Invalid Ethiopian day");
            
            // Reference: Ethiopian year 2000, Meskerem 1 (month=1, day=1) = Gregorian Sep 11, 2007
            const refEthYear = 2000;
            const refGregDate = new Date(Date.UTC(2007, 8, 11)); // Sep 11, 2007 00:00 UTC
            
            // Days from reference Ethiopian date
            let daysDiff = 0;
            // Add years between refEthYear and target year
            for (let y = refEthYear; y < year; y++) {
                daysDiff += isEthiopianLeapYear(y) ? 366 : 365;
            }
            // Add months before target month
            for (let m = 1; m < month; m++) {
                daysDiff += (m === 13) ? (isEthiopianLeapYear(year) ? 6 : 5) : 30;
            }
            // Add days (day-1)
            daysDiff += (day - 1);
            
            const targetGreg = new Date(refGregDate.getTime() + daysDiff * 86400000);
            return targetGreg;
        }
        
        // Convert Gregorian to Ethiopian (already present, but refined for consistency)
        function gregorianToEthiopian(gDate) {
            const gY = gDate.getUTCFullYear();
            const gM = gDate.getUTCMonth() + 1; // 1-12
            const gD = gDate.getUTCDate();
            
            // Ethiopian year estimation
            let ethYear = (gM > 9 || (gM === 9 && gD >= 11)) ? gY - 7 : gY - 8;
            
            // Meskerem 1 of that Ethiopian year in Gregorian
            let meskerem1 = new Date(Date.UTC(ethYear + 7, 8, 11)); // Sep 11
            // Adjust if meskerem1 is after gDate (rare due to leap year shifts)
            if (gDate < meskerem1) {
                ethYear--;
                meskerem1 = new Date(Date.UTC(ethYear + 7, 8, 11));
            }
            const diffDays = Math.floor((gDate - meskerem1) / (24 * 3600 * 1000));
            let month = Math.floor(diffDays / 30) + 1;
            let day = (diffDays % 30) + 1;
            // Pagume adjustment
            if (month > 13) { month = 13; day = diffDays - 12 * 30 + 1; }
            if (month === 13 && day > (isEthiopianLeapYear(ethYear) ? 6 : 5)) { day = isEthiopianLeapYear(ethYear) ? 6 : 5; }
            return { day: day, month: month, year: ethYear };
        }
        
        // ======================== PAST DATE/TIME VALIDATION ========================
        // Parse ethDate string "DD/MM/YYYY" -> {day, month, year}
        function parseEthiopianDateString(dateStr) {
            const parts = dateStr.split('/');
            if (parts.length !== 3) return null;
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
            return { day, month, year };
        }
        
        // Validate if selected Ethiopian datetime is in the future (or exact current moment allowed)
        function isEthiopianFuture(ethDateObj, timeStr) {
            // ethDateObj: { day, month, year }
            // timeStr: "HH:MM" in 24h format
            if (!ethDateObj || !timeStr) return false;
            try {
                const selectedGreg = ethiopianToGregorian(ethDateObj.day, ethDateObj.month, ethDateObj.year);
                const timeParts = timeStr.split(':');
                if (timeParts.length !== 2) return false;
                let hours = parseInt(timeParts[0], 10);
                let minutes = parseInt(timeParts[1], 10);
                if (isNaN(hours) || isNaN(minutes)) return false;
                // Normalize to 0-23 range
                hours = hours % 24;
                selectedGreg.setUTCHours(hours, minutes, 0, 0);
                
                const now = new Date();
                // Compare with current time (local milliseconds)
                const nowMs = now.getTime();
                const selectedMs = selectedGreg.getTime();
                return selectedMs > nowMs;   // strictly future: if equal to now, also future? We allow exact current moment? better to allow only > now
                // Strictly future prevents same minute scheduling, but user can pick minute later. Acceptable.
            } catch (err) {
                console.warn(err);
                return false;
            }
        }
        
        // get current Ethiopian date (for reference UI)
        function getCurrentEthiopianDate() {
            const now = new Date();
            return gregorianToEthiopian(now);
        }
        
        // Populate inline Ethiopian controls with current date and default future-friendly time (e.g., next hour)
        function populateEthiopianInline() {
            const ethDateEl = document.getElementById('ethDate');
            const ethTimeEl = document.getElementById('ethTime');
            const ethPeriodEl = document.getElementById('ethPeriod');
            if (!ethDateEl || !ethTimeEl || !ethPeriodEl) return;
            
            const todayEth = getCurrentEthiopianDate();
            ethDateEl.value = `${String(todayEth.day).padStart(2,'0')}/${String(todayEth.month).padStart(2,'0')}/${todayEth.year}`;
            
            // Default time suggestion: current hour + 1 (if possible) to ensure future
            const now = new Date();
            let futureHour = now.getHours() + 1;
            let defaultMinutes = "00";
            if (futureHour >= 24) {
                futureHour = 0;
                // If we roll to next day, the date might become today? But we keep same date, user must adjust manually.
                // To be safe, we set a default morning hour
                futureHour = 9;
            }
            ethTimeEl.value = `${String(futureHour).padStart(2,'0')}:${defaultMinutes}`;
            ethPeriodEl.value = "Guyyaa";
        }
        
        // ======================== UI HELPERS ========================
        function getCombinedDateTime() {
            const dateStr = document.getElementById('ethDate').value;
            const time = document.getElementById('ethTime').value || '';
            const period = document.getElementById('ethPeriod').value || '';
            if (!dateStr) return '';
            return `${dateStr} EC | ${time} ${period}`;
        }
        
        // Floating particles for background
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = Math.random() * 8 + 4 + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();
        
        function createRipple(event) {
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size/2;
            const y = event.clientY - rect.top - size/2;
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.classList.add('ripple');
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }
        submitBtn.addEventListener('click', createRipple);
        
        // ======================== FORM SUBMISSION WITH PAST DATE BLOCK ========================
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const ethDateRaw = document.getElementById('ethDate').value.trim();
            const ethTimeRaw = document.getElementById('ethTime').value.trim();
            
            // Basic emptiness check
            if (!title || !description) {
                tg.showAlert('⚠️ Please fill in both Title and Description.');
                return;
            }
            if (!ethDateRaw) {
                tg.showAlert('📅 Please enter Ethiopian date (DD/MM/YYYY).');
                return;
            }
            if (!ethTimeRaw) {
                tg.showAlert('⏰ Please select a time.');
                return;
            }
            
            // Parse Ethiopian date
            const parsedDate = parseEthiopianDateString(ethDateRaw);
            if (!parsedDate) {
                tg.showAlert('❌ Invalid Ethiopian date format. Use DD/MM/YYYY (e.g., 25/03/2017).');
                return;
            }
            
            // Validate month range 1-13 and day range
            const maxDaysMonth = (parsedDate.month === 13) ? (isEthiopianLeapYear(parsedDate.year) ? 6 : 5) : 30;
            if (parsedDate.month < 1 || parsedDate.month > 13 || parsedDate.day < 1 || parsedDate.day > maxDaysMonth) {
                tg.showAlert(`📆 Invalid Ethiopian date: month must be 1-13, day up to ${maxDaysMonth} for month ${parsedDate.month}.`);
                return;
            }
            
            // CRITICAL: Past date validation
            const isFuture = isEthiopianFuture(parsedDate, ethTimeRaw);
            if (!isFuture) {
                tg.showAlert('⛔ Cannot schedule live stream in the past.\nPlease select a future date and time (Ethiopian Calendar).\n📆 Ensure the date/time is ahead of current moment.');
                return;
            }
            
            // If valid, proceed
            const scheduled_date = getCombinedDateTime();
            const data = { title, description, scheduled_date };
            
            // Simulate sending
            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner"></i> Sending Request...';
            setTimeout(() => {
                tg.sendData(JSON.stringify(data));
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Request Sent!';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
                setTimeout(() => {
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Request Live Stream';
                    submitBtn.style.background = '';
                }, 2000);
            }, 500);
        });
        
        // Additional helper: also provide instant visual warning if user types past date? Not mandatory, but we add a gentle input validation on blur
        const ethDateInput = document.getElementById('ethDate');
        const ethTimeInput = document.getElementById('ethTime');
        
        function showInlineWarningIfPast() {
            const dateRaw = ethDateInput.value.trim();
            const timeRaw = ethTimeInput.value.trim();
            if (!dateRaw || !timeRaw) return;
            const parsed = parseEthiopianDateString(dateRaw);
            if (!parsed) return;
            try {
                const isFuture = isEthiopianFuture(parsed, timeRaw);
                if (!isFuture) {
                    ethDateInput.style.borderColor = "#dc2626";
                    ethTimeInput.style.borderColor = "#dc2626";
                    // optional subtle tooltip but alert would be intrusive. We'll just style red.
                } else {
                    ethDateInput.style.borderColor = "#e6e6e6";
                    ethTimeInput.style.borderColor = "#e6e6e6";
                }
            } catch(e) {}
        }
        
        ethDateInput.addEventListener('blur', showInlineWarningIfPast);
        ethTimeInput.addEventListener('change', showInlineWarningIfPast);
        ethTimeInput.addEventListener('blur', showInlineWarningIfPast);
        
        // Initialize form with default values (current date + one hour later)
        populateEthiopianInline();
        // Ensure after populate we force revalidate so initial state isn't flagged as past (it shouldn't be)
        setTimeout(() => {
            showInlineWarningIfPast();
        }, 100);
    </script>
</body>
</html>
