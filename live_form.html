<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Stream Request | OBN Cyber Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(220,38,38,0.1) 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out infinite alternate;
            z-index: 0;
        }
        
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
        
        .particle {
            position: absolute;
            background: rgba(220,38,38,0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-50px) translateX(30px); opacity: 0.5; }
        }
        
        .form-card {
            background: #ffffff;
            border-radius: 35px;
            padding: 35px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(220,38,38,0.2);
        }
        
        .form-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
            border-color: rgba(220,38,38,0.4);
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(220,38,38,0.15);
            position: relative;
        }
        
        .logo-wrapper {
            width: 85px;
            height: 85px;
            margin: 0 auto 12px;
            position: relative;
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .official-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(220,38,38,0.2);
            transition: transform 0.3s ease;
        }
        
        .official-logo:hover {
            transform: scale(1.05);
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: 1.5px;
            margin-top: 5px;
        }
        
        .logo-sub {
            font-size: 9px;
            color: #888;
            margin-top: 3px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .logo-container::before {
            content: '●●●';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 6px;
            color: rgba(220,38,38,0.3);
            letter-spacing: 4px;
        }
        
        h1 {
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .live-dot {
            font-size: 12px;
            color: #dc2626;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            position: relative;
        }
        
        .subtitle::before,
        .subtitle::after {
            content: '—';
            margin: 0 10px;
            opacity: 0.5;
            color: #dc2626;
        }
        
        .input-group {
            margin-bottom: 22px;
            position: relative;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateX(-20px);
        }
        
        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.2s; }
        .input-group:nth-child(3) { animation-delay: 0.3s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        #ethiopianInlineGroup input[type="text"],
        #ethiopianInlineGroup select {
            padding: 14px 16px 14px 48px;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
            font-size: 14px;
            color: #111827;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(15,23,42,0.06);
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            appearance: none;
        }

        #ethiopianInlineGroup input[type="text"]::placeholder {
            color: #9ca3af;
            font-weight: 500;
        }

        #ethiopianInlineGroup input[type="text"]:focus,
        #ethiopianInlineGroup select:focus {
            outline: none;
            transform: translateY(-2px);
            border-color: #dc2626;
            box-shadow: 0 8px 26px rgba(220,38,38,0.08);
        }

        #ethiopianInlineGroup > div { display: flex; gap: 12px; flex-wrap: wrap; }
        @media (min-width: 720px) {
            #ethiopianInlineGroup input[type="text"] { flex: 1 1 50%; }
            #ethiopianInlineGroup .time-group { flex: 1 1 50%; }
        }
        @media (max-width: 480px) {
            #ethiopianInlineGroup > div { flex-direction: column; gap: 10px; }
            #ethiopianInlineGroup input[type="text"],
            #ethiopianInlineGroup select { width: 100%; padding-left: 42px; }
        }
        
        .time-group {
            display: flex;
            gap: 6px;
            align-items: center;
            position: relative;
            flex-wrap: wrap;
        }
        .time-group select {
            padding: 14px 6px 14px 10px;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfbfb 100%);
            font-size: 14px;
            color: #111827;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(15,23,42,0.06);
            transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
            appearance: none;
            min-width: 60px;
        }
        .time-group select:focus {
            outline: none;
            transform: translateY(-2px);
            border-color: #dc2626;
            box-shadow: 0 8px 26px rgba(220,38,38,0.08);
        }
        .time-group select#ethPeriod { min-width: 80px; flex: 1; }
        .time-group i.fa-clock {
            position: relative;
            left: 0;
            top: 0;
            transform: none;
            color: #999;
            font-size: 16px;
            margin-right: 4px;
        }
        
        input, textarea {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 500;
        }
        
        textarea {
            padding-top: 14px;
            resize: vertical;
            min-height: 100px;
        }
        
        input:focus, textarea:focus, #ethiopianInlineGroup input[type="text"]:focus, #ethiopianInlineGroup select:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
            transform: scale(1.01);
            background: white;
        }
        
        input:hover, textarea:hover, #ethiopianInlineGroup input[type="text"]:hover, #ethiopianInlineGroup select:hover {
            border-color: #dc2626;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(220,38,38,0.3);
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(220,38,38,0.4);
        }
        
        button:active {
            transform: translateY(2px);
        }
        
        button i {
            margin-right: 10px;
            transition: transform 0.3s;
        }
        
        button:hover i {
            transform: translateX(5px);
        }
        
        .note {
            margin-top: 18px;
            font-size: 11px;
            color: #999;
            text-align: center;
        }
        
        .live-badge {
            display: inline-block;
            background: #dc2626;
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            animation: pulse 1.5s infinite;
            letter-spacing: 0.5px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
        
        button.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        button.loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        @media (max-width: 480px) {
            .form-card {
                padding: 25px;
            }
            .logo-wrapper {
                width: 70px;
                height: 70px;
            }
            .official-logo {
                width: 62px;
                height: 62px;
            }
            .logo-text {
                font-size: 18px;
            }
            h1 {
                font-size: 20px;
            }
            .live-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            input, textarea {
                padding: 12px 12px 12px 44px;
                font-size: 14px;
            }
            button { padding: 14px; font-size: 15px; }
            .time-group select { min-width: 50px; font-size: 13px; padding: 12px 4px; }
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="logo-container">
            <div class="logo-wrapper">
                <img class="official-logo" src="https://play-lh.googleusercontent.com/rJlwNcKtqocZlvqjIvZSFZilJt5XAaZntPP8kto-9dI9BWTY0cFtsUEo74x0Xl7Z7MvG=w240-h480-rw" alt="OBN Cyber Media Logo">
            </div>
            <div class="logo-text">OBN CYBER MEDIA</div>
            <div class="logo-sub">STREAMLINING TELEGRAM BOT</div>
        </div>
        
        <h1>
            <i class="fas fa-circle live-dot"></i>
            Live Stream Request
            <span class="live-badge">LIVE</span>
        </h1>
        <div class="subtitle">Request a live broadcasting event</div>
        
        <form id="liveForm">
            <div class="input-group">
                <i class="fas fa-heading"></i>
                <label for="title">Program Title</label>
                <input type="text" id="title" required placeholder="e.g. Text your program title here">
            </div>
            
            <div class="input-group">
                <i class="fas fa-align-left"></i>
                <label for="description">Description</label>
                <textarea id="description" required placeholder="Brief description of your live stream..."></textarea>
            </div>
            
            <div class="input-group">
                <i class="fas fa-calendar-alt"></i>
                <label>Scheduled Date &amp; Time (Ethiopian Calendar)</label>
                
                <div id="ethiopianInlineGroup">
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <div style="flex:1 1 45%; position:relative; min-width:140px;">
                            <i class="fas fa-calendar-day" style="position:absolute; left:15px; top:50%; transform:translateY(-50%); z-index:2;"></i>
                            <input type="text" id="ethDate" placeholder="DD/MM/YYYY EC" style="padding-left:42px; width:100%;" />
                        </div>
                        <div class="time-group" style="flex:1 1 50%; min-width:180px;">
                            <i class="fas fa-clock"></i>
                            <select id="ethHour"></select>
                            <span style="font-weight:600; color:#999;">:</span>
                            <select id="ethMinute"></select>
                            <select id="ethPeriod">
                                <option value="Ganama">Ganama</option>
                                <option value="Guyyaa">Guyyaa</option>
                                <option value="Galgala">Galgala</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <input type="hidden" id="scheduled_date" name="scheduled_date">
            </div>
            
            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Request Live Stream
            </button>
        </form>
        
        <div class="note">
            <i class="fas fa-clock"></i> Ensure your scheduled date and time are correct.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const form = document.getElementById('liveForm');
        const submitBtn = document.getElementById('submitBtn');

        // ============================================================
        //  ETHIOPIAN ↔ GREGORIAN CONVERSION
        // ============================================================
        function gregorianToEthiopian(gDate) {
            const gY = gDate.getFullYear();
            const gM = gDate.getMonth() + 1;
            const gD = gDate.getDate();

            const newYearDay = 11;
            let ethYear = (gM > 9 || (gM === 9 && gD >= newYearDay)) ? gY - 7 : gY - 8;
            let meskerem1 = new Date(ethYear + 7, 8, newYearDay);
            if (gDate < meskerem1) {
                ethYear = ethYear - 1;
                meskerem1 = new Date(ethYear + 7, 8, newYearDay);
            }
            const diff = Math.floor((gDate - meskerem1) / (24 * 60 * 60 * 1000));
            const monthIndex = Math.floor(diff / 30) + 1;
            const day = (diff % 30) + 1;
            return { day: day, month: monthIndex, year: ethYear };
        }

        function ethiopianToGregorian(day, month, year) {
            // Approximate: Meskerem 1 = Gregorian Sept 11 (or Sept 12 on leap years)
            // We'll use a simple method: start from known date and add days.
            // For simplicity, we use the standard: Meskerem 1 = Sept 11 (Ethiopian New Year)
            // This works for most cases.
            let baseYear = year + 7; // approximate Gregorian year
            let baseMonth = 9; // September
            let baseDay = 11;
            // Adjust for leap years: if (year % 4 == 0) in Ethiopian calendar, New Year is Sept 12
            // But we'll keep it simple for validation purposes – close enough.
            let baseDate = new Date(baseYear, baseMonth - 1, baseDay);
            // Add days: (month - 1) * 30 + (day - 1)
            let daysToAdd = (month - 1) * 30 + (day - 1);
            let result = new Date(baseDate);
            result.setDate(result.getDate() + daysToAdd);
            return result;
        }

        // ============================================================
        //  POPULATE DEFAULTS (TODAY + CURRENT TIME + 1 HOUR)
        // ============================================================
        function populateDefaults() {
            const now = new Date();
            const eth = gregorianToEthiopian(now);
            document.getElementById('ethDate').value =
                String(eth.day).padStart(2, '0') + '/' +
                String(eth.month).padStart(2, '0') + '/' +
                eth.year;

            // Build hour dropdown (01-12)
            const hourSel = document.getElementById('ethHour');
            hourSel.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const opt = document.createElement('option');
                opt.value = String(i).padStart(2, '0');
                opt.textContent = String(i).padStart(2, '0');
                hourSel.appendChild(opt);
            }

            // Build minute dropdown (00-59)
            const minSel = document.getElementById('ethMinute');
            minSel.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const opt = document.createElement('option');
                opt.value = String(i).padStart(2, '0');
                opt.textContent = String(i).padStart(2, '0');
                minSel.appendChild(opt);
            }

            // Set default time to current hour + 1, minute rounded to nearest 5
            let h = now.getHours();
            let m = now.getMinutes();
            // Round minutes to next 5
            m = Math.ceil(m / 5) * 5;
            if (m >= 60) { m = 0; h++; }
            // Add 1 hour
            h = h + 1;
            if (h >= 24) { h = h - 24; }

            // Determine period
            let period = 'Ganama';
            let displayHour = h;
            if (h >= 0 && h < 6) { period = 'Ganama'; displayHour = h === 0 ? 12 : h; }
            else if (h >= 6 && h < 12) { period = 'Ganama'; displayHour = h === 0 ? 12 : h; }
            else if (h >= 12 && h < 18) { period = 'Guyyaa'; displayHour = h === 12 ? 12 : h - 12; }
            else { period = 'Galgala'; displayHour = h === 0 ? 12 : (h > 12 ? h - 12 : h); }
            if (displayHour === 0) displayHour = 12;

            document.getElementById('ethHour').value = String(displayHour).padStart(2, '0');
            document.getElementById('ethMinute').value = String(m).padStart(2, '0');
            document.getElementById('ethPeriod').value = period;
        }

        // ============================================================
        //  VALIDATION: CHECK IF SELECTED DATE/TIME IS IN THE FUTURE
        // ============================================================
        function isSelectedDateTimeFuture() {
            const dateStr = document.getElementById('ethDate').value.trim();
            const hour = parseInt(document.getElementById('ethHour').value, 10);
            const minute = parseInt(document.getElementById('ethMinute').value, 10);
            const period = document.getElementById('ethPeriod').value;

            if (!dateStr) return false;
            const parts = dateStr.split('/');
            if (parts.length !== 3) return false;
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);
            if (isNaN(day) || isNaN(month) || isNaN(year)) return false;

            // Convert Ethiopian to Gregorian
            const gregDate = ethiopianToGregorian(day, month, year);
            // Combine with time
            let hour24 = hour;
            if (period === 'Galgala' && hour < 12) hour24 += 12;
            else if (period === 'Guyyaa' && hour < 12) hour24 += 12;
            else if (period === 'Ganama' && hour === 12) hour24 = 0;
            else if (period === 'Galgala' && hour === 12) hour24 = 12;
            else if (period === 'Guyyaa' && hour === 12) hour24 = 12;

            gregDate.setHours(hour24, minute, 0, 0);
            const now = new Date();
            return gregDate > now;
        }

        // ============================================================
        //  FORM SUBMISSION
        // ============================================================
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const dateStr = document.getElementById('ethDate').value.trim();
            const hour = document.getElementById('ethHour').value || '08';
            const minute = document.getElementById('ethMinute').value || '00';
            const period = document.getElementById('ethPeriod').value || 'Ganama';

            if (!title || !description) {
                tg.showAlert('Please fill all required fields.');
                return;
            }
            if (!dateStr) {
                tg.showAlert('Please select a valid date.');
                return;
            }

            // Validate future date
            if (!isSelectedDateTimeFuture()) {
                tg.showAlert('⚠️ Please select a future date and time.');
                return;
            }

            const scheduled_date = `${dateStr} EC | ${hour}:${minute} ${period}`;
            const data = { title, description, scheduled_date };

            submitBtn.classList.add('loading');
            submitBtn.innerHTML = '<i class="fas fa-spinner"></i> Sending Request...';
            setTimeout(() => {
                tg.sendData(JSON.stringify(data));
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Request Sent!';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
                setTimeout(() => {
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Request Live Stream';
                    submitBtn.style.background = '';
                }, 2000);
            }, 500);
        });

        // ============================================================
        //  INIT
        // ============================================================
        populateDefaults();

        // Floating particles
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 6 + 2 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.animationDuration = Math.random() * 8 + 4 + 's';
            document.body.appendChild(p);
        }

        // Ripple effect on submit button
        submitBtn.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size/2;
            const y = e.clientY - rect.top - size/2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>
</body>
</html>
