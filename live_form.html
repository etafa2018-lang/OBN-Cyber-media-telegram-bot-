<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Stream Request | OBN Cyber Media</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            padding: 16px;
            position: relative;
        }

        .form-card {
            background: #fff;
            border-radius: 30px;
            padding: 28px 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(220,38,38,0.15);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(220,38,38,0.12);
        }
        .logo-wrapper {
            width: 72px; height: 72px;
            margin: 0 auto 10px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .official-logo {
            width: 64px; height: 64px;
            border-radius: 50%;
            object-fit: cover;
        }
        .logo-text {
            font-size: 18px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: 1px;
        }
        .logo-sub {
            font-size: 8px;
            color: #999;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0 4px;
        }
        .live-dot {
            font-size: 10px;
            color: #dc2626;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        .live-badge {
            background: #dc2626;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            animation: pulse 1.5s infinite;
            letter-spacing: 0.5px;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.7;} }

        .subtitle {
            color: #888;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
        }
        .subtitle::before { content: '—'; margin-right: 8px; opacity:0.4; color:#dc2626; }
        .subtitle::after { content: '—'; margin-left: 8px; opacity:0.4; color:#dc2626; }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1a1a1a;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e6e6e6;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            background: #f8f9fa;
            color: #1a1a1a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #dc2626;
            outline: none;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.08);
            background: #fff;
        }

        /* --- Date + Time in one line --- */
        .row-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .row-group .date-wrap {
            flex: 1 1 45%;
            min-width: 120px;
            position: relative;
        }
        .row-group .date-wrap input {
            cursor: pointer;
            padding: 12px 14px;
            background: #f8f9fa;
        }
        .row-group .time-group {
            flex: 1 1 45%;
            min-width: 150px;
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .row-group .time-group select {
            padding: 10px 4px;
            border: 2px solid #e6e6e6;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: #f8f9fa;
            color: #1a1a1a;
            appearance: none;
            flex: 1;
            min-width: 40px;
            transition: border-color 0.2s;
        }
        .row-group .time-group select:focus {
            border-color: #dc2626;
            outline: none;
        }
        .row-group .time-group .colon {
            font-weight: 700;
            color: #999;
        }
        .row-group .time-group select#ethPeriod {
            flex: 1.2;
            min-width: 70px;
        }

        @media (max-width: 420px) {
            .row-group .date-wrap { flex: 1 1 100%; }
            .row-group .time-group { flex: 1 1 100%; }
            .row-group .time-group select { min-width: 36px; font-size: 12px; padding: 8px 2px; }
        }

        /* --- Calendar Popup (auto-select on tap) --- */
        .calendar-popup {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 16px 32px -8px rgba(0,0,0,0.3);
            z-index: 100;
            padding: 16px;
            border: 1px solid #eee;
            min-width: 260px;
        }
        .calendar-popup.show { display: block; }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-nav {
            background: #f5f5f5;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: 0.2s;
        }
        .calendar-nav:hover { background: #dc2626; color: #fff; }
        .calendar-month-year {
            font-weight: 700;
            font-size: 14px;
            color: #333;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 6px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .calendar-day {
            text-align: center;
            padding: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            background: #f9f9f9;
            transition: 0.15s;
        }
        .calendar-day:hover { background: #e8e8e8; }
        .calendar-day.selected {
            background: #dc2626;
            color: #fff;
        }
        .calendar-day.today { border: 2px solid #dc2626; }
        .calendar-day.empty { background: transparent; cursor: default; color: #ddd; }
        .calendar-day.empty:hover { background: transparent; }

        /* --- Submit Button --- */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(220,38,38,0.25);
            margin-top: 6px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(220,38,38,0.35); }
        button:active { transform: translateY(1px); }
        button i { margin-right: 8px; }

        button.loading { opacity: 0.7; pointer-events: none; }
        button.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .note {
            margin-top: 14px;
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }

        /* Floating particles (lightweight) */
        .particle {
            position: fixed;
            background: rgba(220,38,38,0.08);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }
        @keyframes float {
            0%,100%{transform:translateY(0) translateX(0); opacity:0;}
            50%{transform:translateY(-30px) translateX(20px); opacity:0.4;}
        }

        @media (max-width: 480px) {
            .form-card { padding: 20px 16px; }
            .logo-wrapper { width: 60px; height: 60px; }
            .official-logo { width: 52px; height: 52px; }
            .logo-text { font-size: 16px; }
            h1 { font-size: 18px; }
            input, textarea { font-size: 13px; padding: 10px 12px; }
            .calendar-popup { left: -8px; right: -8px; min-width: unset; }
        }
    </style>
</head>
<body>

    <div class="form-card">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo-wrapper">
                <img class="official-logo" src="https://play-lh.googleusercontent.com/rJlwNcKtqocZlvqjIvZSFZilJt5XAaZntPP8kto-9dI9BWTY0cFtsUEo74x0Xl7Z7MvG=w240-h480-rw" alt="OBN Cyber Media Logo">
            </div>
            <div class="logo-text">OBN CYBER MEDIA</div>
            <div class="logo-sub">STREAMLINING TELEGRAM BOT</div>
        </div>

        <h1>
            <i class="fas fa-circle live-dot"></i>
            Live Stream Request
            <span class="live-badge">LIVE</span>
        </h1>
        <div class="subtitle">Request a live broadcasting event</div>

        <form id="liveForm">
            <div class="input-group">
                <label for="title">Program Title</label>
                <input type="text" id="title" placeholder="e.g. Text your program title here" required>
            </div>

            <div class="input-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Brief description of your live stream..." required></textarea>
            </div>

            <div class="input-group">
                <label>Scheduled Date &amp; Time</label>
                <div class="row-group">
                    <!-- Date Input with calendar popup -->
                    <div class="date-wrap">
                        <input type="text" id="ethDate" placeholder="DD/MM/YYYY EC" readonly>
                        <div class="calendar-popup" id="calendarPopup">
                            <div class="calendar-header">
                                <button class="calendar-nav" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                                <span class="calendar-month-year" id="calendarTitle">Month Year</span>
                                <button class="calendar-nav" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                            </div>
                            <div class="calendar-weekdays">
                                <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                            </div>
                            <div class="calendar-days" id="calendarDays"></div>
                        </div>
                    </div>

                    <!-- Time Selectors -->
                    <div class="time-group">
                        <select id="ethHour"></select>
                        <span class="colon">:</span>
                        <select id="ethMinute"></select>
                        <select id="ethPeriod">
                            <option value="Ganama">Ganama</option>
                            <option value="Guyyaa">Guyyaa</option>
                            <option value="Galgala">Galgala</option>
                        </select>
                    </div>
                </div>
                <input type="hidden" id="scheduled_date" name="scheduled_date">
            </div>

            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Request Live Stream
            </button>
        </form>

        <div class="note">
            <i class="fas fa-clock"></i> Ensure your scheduled date and time are correct.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ============================================================
        //  ETHIOPIAN ↔ GREGORIAN CONVERSION
        // ============================================================
        function gregorianToEthiopian(gDate) {
            const gY = gDate.getFullYear(), gM = gDate.getMonth() + 1, gD = gDate.getDate();
            const newYearDay = 11;
            let ethYear = (gM > 9 || (gM === 9 && gD >= newYearDay)) ? gY - 7 : gY - 8;
            let meskerem1 = new Date(ethYear + 7, 8, newYearDay);
            if (gDate < meskerem1) { ethYear--; meskerem1 = new Date(ethYear + 7, 8, newYearDay); }
            const diff = Math.floor((gDate - meskerem1) / (24 * 60 * 60 * 1000));
            const monthIndex = Math.floor(diff / 30) + 1;
            const day = (diff % 30) + 1;
            return { day, month: monthIndex, year: ethYear };
        }

        function ethiopianToGregorian(day, month, year) {
            const baseDate = new Date(year + 7, 8, 11);
            baseDate.setDate(baseDate.getDate() + (month - 1) * 30 + (day - 1));
            return baseDate;
        }

        // ============================================================
        //  CALENDAR LOGIC
        // ============================================================
        const ethMonthNames = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit',
            'Megabit','Miyazya','Ginbot','Sene','Hamle','Nehasse','Pagume'];

        let currentYear, currentMonth, selectedDay, selectedMonth, selectedYear;

        function getDaysInMonth(m, y) { return m === 13 ? 6 : 30; }

        function renderCalendar(y, m) {
            const daysContainer = document.getElementById('calendarDays');
            document.getElementById('calendarTitle').textContent = `${ethMonthNames[m-1]} ${y}`;
            daysContainer.innerHTML = '';
            const total = getDaysInMonth(m, y);
            const first = ethiopianToGregorian(1, m, y);
            let firstDay = first.getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < firstDay; i++) {
                const e = document.createElement('div');
                e.className = 'calendar-day empty';
                daysContainer.appendChild(e);
            }

            const today = gregorianToEthiopian(new Date());
            for (let d = 1; d <= total; d++) {
                const div = document.createElement('div');
                div.className = 'calendar-day';
                div.textContent = d;
                if (today.year === y && today.month === m && today.day === d) div.classList.add('today');
                if (selectedYear === y && selectedMonth === m && selectedDay === d) div.classList.add('selected');
                div.dataset.day = d; div.dataset.month = m; div.dataset.year = y;
                div.addEventListener('click', function() {
                    // Auto-select on tap
                    document.querySelectorAll('.calendar-day.selected').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    const d2 = parseInt(this.dataset.day, 10);
                    const m2 = parseInt(this.dataset.month, 10);
                    const y2 = parseInt(this.dataset.year, 10);
                    selectedDay = d2; selectedMonth = m2; selectedYear = y2;
                    // Auto-assign and close
                    document.getElementById('ethDate').value =
                        String(d2).padStart(2,'0') + '/' + String(m2).padStart(2,'0') + '/' + y2;
                    document.getElementById('calendarPopup').classList.remove('show');
                });
                daysContainer.appendChild(div);
            }
        }

        function prevMonth() {
            if (currentMonth === 1) { currentMonth = 13; currentYear--; }
            else { currentMonth--; }
            renderCalendar(currentYear, currentMonth);
        }
        function nextMonth() {
            if (currentMonth === 13) { currentMonth = 1; currentYear++; }
            else { currentMonth++; }
            renderCalendar(currentYear, currentMonth);
        }

        // ============================================================
        //  POPULATE DEFAULTS
        // ============================================================
        function populateDefaults() {
            const now = new Date();
            const eth = gregorianToEthiopian(now);
            currentYear = eth.year; currentMonth = eth.month;
            selectedDay = eth.day; selectedMonth = eth.month; selectedYear = eth.year;
            document.getElementById('ethDate').value =
                String(eth.day).padStart(2,'0') + '/' + String(eth.month).padStart(2,'0') + '/' + eth.year;
            renderCalendar(currentYear, currentMonth);

            // Hour 01-12
            const hSel = document.getElementById('ethHour');
            hSel.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const o = document.createElement('option');
                o.value = String(i).padStart(2,'0');
                o.textContent = String(i).padStart(2,'0');
                hSel.appendChild(o);
            }
            // Minute 00-59
            const mSel = document.getElementById('ethMinute');
            mSel.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const o = document.createElement('option');
                o.value = String(i).padStart(2,'0');
                o.textContent = String(i).padStart(2,'0');
                mSel.appendChild(o);
            }

            let h = now.getHours(), min = now.getMinutes();
            min = Math.ceil(min / 5) * 5;
            if (min >= 60) { min = 0; h++; }
            h = h + 1;
            if (h >= 24) h = h - 24;

            let period = 'Ganama', disp = h;
            if (h >= 0 && h < 6) { period = 'Ganama'; disp = h === 0 ? 12 : h; }
            else if (h >= 6 && h < 12) { period = 'Ganama'; disp = h === 0 ? 12 : h; }
            else if (h >= 12 && h < 18) { period = 'Guyyaa'; disp = h === 12 ? 12 : h - 12; }
            else { period = 'Galgala'; disp = h === 0 ? 12 : (h > 12 ? h - 12 : h); }
            if (disp === 0) disp = 12;

            document.getElementById('ethHour').value = String(disp).padStart(2,'0');
            document.getElementById('ethMinute').value = String(min).padStart(2,'0');
            document.getElementById('ethPeriod').value = period;
        }

        // ============================================================
        //  TOGGLE CALENDAR ON CLICK
        // ============================================================
        document.getElementById('ethDate').addEventListener('click', function() {
            const popup = document.getElementById('calendarPopup');
            popup.classList.toggle('show');
            if (popup.classList.contains('show')) renderCalendar(currentYear, currentMonth);
        });

        document.getElementById('prevMonth').addEventListener('click', prevMonth);
        document.getElementById('nextMonth').addEventListener('click', nextMonth);

        // Close calendar when clicking outside
        document.addEventListener('click', function(e) {
            const wrap = document.querySelector('.date-wrap');
            if (wrap && !wrap.contains(e.target)) {
                document.getElementById('calendarPopup').classList.remove('show');
            }
        });

        // ============================================================
        //  VALIDATION: CHECK IF SELECTED DATE/TIME IS IN THE FUTURE
        // ============================================================
        function isFuture() {
            const dateStr = document.getElementById('ethDate').value.trim();
            if (!dateStr) return false;
            const parts = dateStr.split('/');
            if (parts.length !== 3) return false;
            const d = parseInt(parts[0],10), m = parseInt(parts[1],10), y = parseInt(parts[2],10);
            if (isNaN(d)||isNaN(m)||isNaN(y)) return false;

            const greg = ethiopianToGregorian(d, m, y);
            let h = parseInt(document.getElementById('ethHour').value,10);
            const min = parseInt(document.getElementById('ethMinute').value,10);
            const period = document.getElementById('ethPeriod').value;

            let h24 = h;
            if (period === 'Galgala' && h < 12) h24 += 12;
            else if (period === 'Guyyaa' && h < 12) h24 += 12;
            else if (period === 'Ganama' && h === 12) h24 = 0;
            else if (period === 'Galgala' && h === 12) h24 = 12;
            else if (period === 'Guyyaa' && h === 12) h24 = 12;

            greg.setHours(h24, min, 0, 0);
            return greg > new Date();
        }

        // ============================================================
        //  FORM SUBMISSION
        // ============================================================
        document.getElementById('liveForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const desc = document.getElementById('description').value.trim();
            const date = document.getElementById('ethDate').value.trim();
            const hour = document.getElementById('ethHour').value;
            const min = document.getElementById('ethMinute').value;
            const period = document.getElementById('ethPeriod').value;

            if (!title || !desc) { tg.showAlert('Please fill all required fields.'); return; }
            if (!date) { tg.showAlert('Please select a valid date.'); return; }
            if (!isFuture()) { tg.showAlert('⚠️ Please select a future date and time.'); return; }

            const scheduled = `${date} EC | ${hour}:${min} ${period}`;
            const data = { title, description: desc, scheduled_date: scheduled };

            const btn = document.getElementById('submitBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> Sending Request...';
            setTimeout(() => {
                tg.sendData(JSON.stringify(data));
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Request Sent!';
                btn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Request Live Stream';
                    btn.style.background = '';
                }, 2000);
            }, 300);
        });

        // ============================================================
        //  INIT
        // ============================================================
        populateDefaults();

        // Floating particles (lightweight)
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const s = Math.random() * 4 + 2;
            p.style.width = s + 'px'; p.style.height = s + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.animationDuration = Math.random() * 8 + 4 + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
